name: Scrape MTG Arena Standard meta

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

jobs:
  scrape:
    name: Scrape Untapped.gg and ingest rankings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo gem install selenium-webdriver
      - run: ruby bin/scrape_mtg_meta
        env:
          MTG_INGEST_URL: "https://kevinskilton.fly.dev/internal/mtg_rankings"
          MTG_INGEST_TOKEN: ${{ secrets.MTG_INGEST_TOKEN }}
