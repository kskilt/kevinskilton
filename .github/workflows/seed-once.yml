name: Run db:seed (manual)

on:
  workflow_dispatch:

jobs:
  seed:
    name: Seed production database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          MACHINE_ID=$(flyctl machines list -a kevinskilton --json | jq -r '.[0].id')
          flyctl machine start "$MACHINE_ID" -a kevinskilton || true
          sleep 5
          flyctl machine exec "$MACHINE_ID" "sh -c 'cd /rails && bin/rails db:seed'" -a kevinskilton
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
